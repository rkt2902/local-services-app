# Verifica cada PR (e cada push para main) que mexa na app: flutter analyze
# e flutter test. Não precisa de secrets nem de configuração.
name: CI

on:
  pull_request:
    paths:
      - 'servicesapp/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'servicesapp/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servicesapp
    steps:
      - uses: actions/checkout@v4

      # Mesma versão do deploy-web.yml e do docs/ARCHITECTURE.md.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test
