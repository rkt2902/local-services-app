# Publica a versão web (servicesapp/) no Cloudflare Pages, servida em
# https://projardim.pt. Só corre à mão, em Actions > Deploy web > Run
# workflow, para a web não ficar à frente de migrations por aplicar.
# Desde 27/11 já não usa o Netlify (o DNS do domínio já estava na Cloudflare).
# Configuração única: ver servicesapp/docs/web.md, secção 2.
name: Deploy web

on:
  workflow_dispatch:
  # Também corre sozinho quando este ficheiro muda no main (por exemplo no
  # merge que o criou), para não ser preciso abrir o Actions no telemóvel.
  # Um merge de código normal não publica.
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-web.yml']

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: servicesapp
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Nome do projeto no Cloudflare Pages (cria-se sozinho no 1.º deploy).
      PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'projardim' }}
      # Endereço público: QR e link do cartão do Profissional, textos legais.
      APP_PUBLIC_URL: ${{ vars.APP_PUBLIC_URL || 'https://projardim.pt' }}
    steps:
      - uses: actions/checkout@v4

      - name: Confirmar secrets
        run: |
          for name in SUPABASE_URL SUPABASE_ANON_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Falta o secret $name (Settings > Secrets and variables > Actions)."
              exit 1
            fi
          done

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - run: flutter pub get

      # SUPPORT_EMAIL, FACEBOOK_LOGIN_ENABLED e GOOGLE_WEB_CLIENT_ID são
      # opcionais (Settings > Secrets and variables > Actions > Variables).
      # Ver servicesapp/docs/SETUP.md.
      - name: Build web
        env:
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
          FACEBOOK_LOGIN_ENABLED: ${{ vars.FACEBOOK_LOGIN_ENABLED }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: |
          # Uma variável antiga a apontar para o Netlify punha o QR e os links
          # do cartão no sítio errado: ignora-se e usa-se o domínio.
          case "$APP_PUBLIC_URL" in
            *netlify.app*)
              echo "::warning::A variável APP_PUBLIC_URL ainda aponta para o Netlify ($APP_PUBLIC_URL). Uso https://projardim.pt; apague ou corrija a variável."
              APP_PUBLIC_URL=https://projardim.pt
              ;;
          esac
          APP_PUBLIC_URL="${APP_PUBLIC_URL%/}"
          echo "APP_PUBLIC_URL=$APP_PUBLIC_URL" >> "$GITHUB_ENV"
          extra=()
          if [ -n "$SUPPORT_EMAIL" ]; then extra+=(--dart-define=SUPPORT_EMAIL="$SUPPORT_EMAIL"); fi
          if [ -n "$FACEBOOK_LOGIN_ENABLED" ]; then extra+=(--dart-define=FACEBOOK_LOGIN_ENABLED="$FACEBOOK_LOGIN_ENABLED"); fi
          if [ -n "$GOOGLE_WEB_CLIENT_ID" ]; then extra+=(--dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID"); fi
          flutter build web --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=APP_PUBLIC_URL="$APP_PUBLIC_URL" \
            "${extra[@]}"

      # O Cloudflare Pages já devolve index.html em caminhos que não existem
      # (/w/<id>, recarregar páginas internas) porque não há 404.html.
      # web/_headers impede que o index.html e o service worker fiquem em
      # cache antigo depois de um deploy.
      - name: Criar o projeto no Cloudflare Pages (só da primeira vez)
        run: |
          if npx --yes wrangler@3 pages project list | grep -qw "$PAGES_PROJECT"; then
            echo "Projeto $PAGES_PROJECT já existe."
          else
            npx --yes wrangler@3 pages project create "$PAGES_PROJECT" --production-branch=main
          fi

      - name: Publicar no Cloudflare Pages
        run: >
          npx --yes wrangler@3 pages deploy build/web
          --project-name="$PAGES_PROJECT"
          --branch=main
          --commit-hash="${{ github.sha }}"
          --commit-dirty=true

      # Liga projardim.pt e www ao projeto e põe os registos DNS a apontar
      # para <projeto>.pages.dev (só A/AAAA/CNAME desses dois nomes; MX e TXT,
      # como os do Brevo, ficam intactos). Pode correr as vezes que for
      # preciso: o que já está certo não muda.
      # O token precisa de: Account > Cloudflare Pages > Edit, Zone > DNS >
      # Edit e Zone > Zone > Read (zona projardim.pt).
      - name: Ligar o domínio ao Cloudflare Pages
        run: |
          set -euo pipefail
          api() { curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "$@"; }
          base=https://api.cloudflare.com/client/v4
          apex="${APP_PUBLIC_URL#https://}"; apex="${apex#www.}"; apex="${apex%%/*}"
          target="$PAGES_PROJECT.pages.dev"

          zone=$(api "$base/zones?name=$apex" | jq -r '.result[0].id // empty')
          if [ -z "$zone" ]; then
            echo "::error::Não encontrei a zona $apex na Cloudflare. O token precisa de Zone > Zone > Read e Zone > DNS > Edit nessa zona."
            exit 1
          fi

          for name in "$apex" "www.$apex"; do
            records=$(api "$base/zones/$zone/dns_records?name=$name&per_page=100")
            ok=$(echo "$records" | jq -r --arg t "$target" '[.result[] | select(.type=="CNAME" and .content==$t)] | length')
            if [ "$ok" = "0" ]; then
              for id in $(echo "$records" | jq -r '.result[] | select(.type=="A" or .type=="AAAA" or .type=="CNAME") | .id'); do
                old=$(echo "$records" | jq -r --arg id "$id" '.result[] | select(.id==$id) | "\(.type) \(.content)"')
                echo "DNS $name: apagar registo antigo ($old)"
                api -X DELETE "$base/zones/$zone/dns_records/$id" | jq -e '.success' >/dev/null
              done
              echo "DNS $name: criar CNAME -> $target"
              api -X POST "$base/zones/$zone/dns_records" \
                --data "{\"type\":\"CNAME\",\"name\":\"$name\",\"content\":\"$target\",\"proxied\":true,\"ttl\":1}" \
                | jq -e '.success' >/dev/null
            else
              echo "DNS $name: já aponta para $target"
            fi

            res=$(api -X POST "$base/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT/domains" --data "{\"name\":\"$name\"}")
            if echo "$res" | jq -e '.success' >/dev/null; then
              echo "Pages: $name adicionado ao projeto"
            elif echo "$res" | grep -qi 'already'; then
              echo "Pages: $name já estava no projeto"
            else
              echo "::error::Não consegui adicionar $name ao Pages: $(echo "$res" | jq -c '.errors')"
              exit 1
            fi
          done

      - name: Confirmar que o domínio responde
        run: |
          sleep 60
          for url in "$APP_PUBLIC_URL/" "$APP_PUBLIC_URL/privacidade/"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 20 "$url" || echo 000)
            echo "$url -> $code"
            if [ "$code" != "200" ]; then
              echo "::warning::$url respondeu $code. O deploy foi feito, mas o domínio ainda não serve o site (ver docs/web.md, secção 2)."
            fi
          done
